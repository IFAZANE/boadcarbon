<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interface Transport - Émissions CO₂</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    :root {
      --boad-red: #a71930;
      --boad-red-dark: #891625;
      --white: #fff;
      --boad-yellow: #FFCC00;
      --boad-yellow-dark: #e6b800;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafafa;
    }

    header {
      background-color: #006400;
      height: 80px;
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      overflow: hidden;
    }

    .header-left img {
      height: 120px;
      width: auto;
      object-fit: contain;
    }

    .header-center h1 {
      margin: 0;
      font-weight: 700;
      font-size: 1.75rem;
      color: #fff;
    }

    nav.header-nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }
    nav.header-nav a:hover { background-color: rgba(255,255,255,0.3); }

    .main-content {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 20px;
      background: white;
      box-shadow: 0 0 10px rgb(0 0 0 / 0.1);
      border-radius: 8px;
    }

    .add-buttons {
      margin: 10px 0 20px;
      display: flex;
      gap: 15px;
    }
    .add-buttons button {
      background-color: var(--boad-yellow);
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: #333;
      transition: background-color 0.3s ease;
      flex-grow: 1;
    }
    .add-buttons button:hover { background-color: var(--boad-yellow-dark); }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 15px;
      border: 1px solid #ddd;
    }
    th {
      background-color: var(--boad-red);
      color: white;
    }
    tr.section-title td {
      background-color: #f4f4f4;
      font-weight: 700;
      color: var(--boad-red-dark);
    }
    tr.total-row td {
      background-color: var(--boad-red);
      color: var(--white);
      font-weight: bold;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--boad-red);
      font-size: 18px;
      cursor: pointer;
    }

    /* ✅ Restauration de ton style d’origine pour la description */
    #enginDescription {
      margin-top: 20px;
      padding: 15px;
      background-color: #f9f9f9;
      border-left: 5px solid var(--boad-red);
      font-style: italic;
      color: #333;
      font-size: 14px;
      min-height: 40px;
    }
  </style>
</head>

<body id="transportTableBody">

<header>
  <div class="header-left">
    <img src="{{ url_for('static', filename='BOADCarbone.png') }}" alt="Logo BOAD" />
  </div>
  <div class="header-center">
    <h1>Transport – Émissions CO₂</h1>
  </div>
  <nav class="header-nav">
    <a href="{{ url_for('index') }}">Accueil</a>
    <a href="{{ url_for('apropos') }}">À propos</a>
    <a href="{{ url_for('contact') }}">Contacts</a>
    <a href="{{ url_for('aide') }}">Aide</a>
  </nav>
</header>

<main class="main-content">
  <h2>Transport</h2>
  <div class="add-buttons">
    <button type="button" onclick="addTransportRow('scope_1')">➕ Ajouter Scope 1</button>
    <button type="button" onclick="addTransportRow('scope_3')">➕ Ajouter Scope 3</button>
  </div>

  <table id="transportTable">
    <thead>
      <tr>
        <th>Type de Transport</th>
        <th>Type d'engin</th>
        <th>Caractéristiques</th>
        <th>Nombre</th>
        <th>Distance (km)</th>
        <th>Émissions (kgCO₂e)</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="transportBody"></tbody>
  </table>

  <!-- ✅ Description d’engin restaurée -->
  <div id="enginDescription">La description de l'engin sélectionné apparaîtra ici.</div>

  <div style="text-align: right; margin-top: 20px;">
    <button style="background-color: var(--boad-yellow); padding: 12px 24px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;" onclick="suivant()">Étape suivante (1/3)→</button>
  </div>
</main>

<script>
let enginsData = {{ engins_json | safe }};
let transportRows = [];
const scopes = ["scope_1", "scope_3"];

function afficherDescription(description) {
  document.getElementById('enginDescription').textContent = description || 'La description de l\'engin sélectionné apparaîtra ici.';
}

function saveAndRender() { renderTable(); }

function addTransportRow(scope) {
  transportRows.push({
    typeTransport: 'personne',
    scope,
    categorie: '',
    engin: '',
    facteur: 0,
    description: '',
    nombre: 1,
    distance: 0,
    type_engin_id: null
  });
  afficherDescription('');
  saveAndRender();
}

function renderTable() {
  const tbody = document.getElementById('transportBody');
  tbody.innerHTML = '';

  scopes.forEach(scope => {
    const trTitle = document.createElement('tr');
    trTitle.className = 'section-title';
    const tdTitle = document.createElement('td');
    tdTitle.colSpan = 7;
    tdTitle.textContent = scope.charAt(0).toUpperCase() + scope.slice(1).replace('_', ' ');
    trTitle.appendChild(tdTitle);
    tbody.appendChild(trTitle);

    const rowsFiltered = transportRows.filter(r => r.scope === scope);
    rowsFiltered.forEach(row => {
      const tr = document.createElement('tr');

      const tdType = document.createElement('td');
      const selectTypeTransport = document.createElement('select');
      selectTypeTransport.innerHTML = `
        <option value="personne" ${row.typeTransport === 'personne' ? 'selected' : ''}>Personnes</option>
        <option value="marchandise" ${row.typeTransport === 'marchandise' ? 'selected' : ''}>Marchandises</option>
      `;
      selectTypeTransport.onchange = e => {
        row.typeTransport = e.target.value;
        row.categorie = '';
        row.engin = '';
        row.facteur = 0;
        row.type_engin_id = null;
        afficherDescription('');
        saveAndRender();
      };
      tdType.appendChild(selectTypeTransport);
      tr.appendChild(tdType);

      const tdCat = document.createElement('td');
      const selectCat = document.createElement('select');
      selectCat.innerHTML = `<option value="">-- Choisir une catégorie --</option>`;
      if (enginsData[scope] && enginsData[scope][row.typeTransport]) {
        Object.keys(enginsData[scope][row.typeTransport]).forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          if (cat === row.categorie) opt.selected = true;
          selectCat.appendChild(opt);
        });
      }
      selectCat.onchange = e => {
        row.categorie = e.target.value;
        row.engin = '';
        row.facteur = 0;
        row.type_engin_id = null;
        afficherDescription('');
        saveAndRender();
      };
      tdCat.appendChild(selectCat);
      tr.appendChild(tdCat);

      const tdEng = document.createElement('td');
      const selectEng = document.createElement('select');
      selectEng.innerHTML = `<option value="">-- Choisir un engin --</option>`;
      if (
        row.categorie &&
        enginsData[scope] &&
        enginsData[scope][row.typeTransport] &&
        enginsData[scope][row.typeTransport][row.categorie]
      ) {
        enginsData[scope][row.typeTransport][row.categorie].forEach(engObj => {
          const opt = document.createElement('option');
          opt.value = engObj.nom;
          opt.textContent = engObj.nom;
          if (engObj.nom === row.engin) opt.selected = true;
          selectEng.appendChild(opt);
        });
      }
      selectEng.onchange = e => {
        const sel = e.target.value;
        row.engin = sel;
        const eng = enginsData[scope][row.typeTransport][row.categorie].find(en => en.nom === sel);
        if (eng) {
          row.facteur = eng.facteur;
          row.description = eng.description;
          row.type_engin_id = eng.id;
          afficherDescription(row.description);
        } else {
          row.facteur = 0;
          row.description = '';
          row.type_engin_id = null;
          afficherDescription('');
        }
        saveAndRender();
      };
      tdEng.appendChild(selectEng);
      tr.appendChild(tdEng);

      const tdNb = document.createElement('td');
      const inputNb = document.createElement('input');
      inputNb.type = 'number';
      inputNb.min = '1';
      inputNb.value = row.nombre || 1;
      inputNb.oninput = e => {
        row.nombre = Math.max(1, parseInt(e.target.value) || 1);
        sessionStorage.setItem('transportRows', JSON.stringify(transportRows));
      };
      inputNb.onblur = () => saveAndRender();
      tdNb.appendChild(inputNb);
      tr.appendChild(tdNb);

      const tdDist = document.createElement('td');
      const inputDist = document.createElement('input');
      inputDist.type = 'number';
      inputDist.min = '0';
      inputDist.step = '0.1';
      inputDist.value = row.distance || 0;
      inputDist.oninput = e => {
        row.distance = parseFloat(e.target.value) || 0;
        sessionStorage.setItem('transportRows', JSON.stringify(transportRows));
      };
      inputDist.onblur = () => saveAndRender();
      tdDist.appendChild(inputDist);
      tr.appendChild(tdDist);

      const tdEm = document.createElement('td');
      const emissionsEngin = ((row.facteur || 0) * (row.distance || 0) * (row.nombre || 1));
      tdEm.textContent = emissionsEngin.toFixed(2);
      tr.appendChild(tdEm);

      const tdAction = document.createElement('td');
      const btnDel = document.createElement('button');
      btnDel.className = 'action-btn';
      btnDel.textContent = '🗑️';
      btnDel.onclick = () => {
        transportRows.splice(transportRows.indexOf(row), 1);
        afficherDescription('');
        saveAndRender();
      };
      tdAction.appendChild(btnDel);
      tr.appendChild(tdAction);

      tbody.appendChild(tr);
    });
  });

  const total = transportRows.reduce((acc, r) =>
    acc + ((r.facteur || 0) * (r.distance || 0) * (r.nombre || 1))
  , 0);

  const trTotal = document.createElement('tr');
  trTotal.className = 'total-row';
  trTotal.innerHTML = `<td colspan="5">Total</td><td colspan="2"><span>${total.toFixed(2)}</span> kgCO₂e</td>`;
  tbody.appendChild(trTotal);

  sessionStorage.setItem('transportRows', JSON.stringify(transportRows));

  let emissionData = JSON.parse(localStorage.getItem("emissionData") || "{}");
  emissionData.transport = total;
  emissionData.transportRows = transportRows;
  localStorage.setItem("emissionData", JSON.stringify(emissionData));
}

function suivant() {
  window.location.href = "{{ url_for('energie') }}";
}

document.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('transportRows');
  if (saved) transportRows = JSON.parse(saved);
  renderTable();
});
</script>

<div id="google_translate_element" style="position: fixed; top: 10px; right: 10px; z-index: 9999;"></div>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'fr',
      includedLanguages: 'en,fr,pt,fon',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
      autoDisplay: false
    }, 'google_translate_element');
  }
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
