<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interface Équipements - Émissions CO₂</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    :root {
      --boad-red: #a71930;
      --boad-red-dark: #891625;
      --white: #fff;
      --boad-yellow: #FFCC00;
      --boad-yellow-dark: #e6b800;
    }

    body { margin: 0; font-family: Arial, sans-serif; background: #fafafa; }

    /* ==== BARRE DE MENU HORIZONTALE ==== */

  header {
  background-color: #006400; /* Vert foncé */
  height: 80px;
  padding: 0 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  overflow: hidden;
}

    .header-left {
  display: flex;
  align-items: center;
  height: 100%;
}

.header-left img {
  height: 120px;
  width: auto;
  display: block;
  object-fit: contain;
}

    .header-center { flex-grow: 1; min-width: 250px; text-align: center; }
    .header-center h1 {
      margin: 0;
      font-weight: 700;
      font-size: 1.75rem;
      color: #fff;
      user-select: none;
    }
    nav.header-nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    nav.header-nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      transition: background-color 0.3s ease, color 0.3s ease;
      white-space: nowrap;
      font-size: 1rem;
    }
    nav.header-nav a:hover,
    nav.header-nav a:focus {
      background-color: rgba(255, 255, 255, 0.3);
      outline: none;
      color: #ffebc2;
    }
    .quit-btn {
      background-color: var(--boad-red-dark);
      color: white;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .quit-btn:hover { background-color: #70121d; }

    /* ==== CONTENU ==== */
    .main-content {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 20px;
      background: white;
      box-shadow: 0 0 10px rgb(0 0 0 / 0.1);
      border-radius: 8px;
    }

    h2 { color: var(--boad-red); margin-bottom: 20px; }

    .add-buttons {
  margin: 10px 0 20px;
  display: flex;
  justify-content: center; /* Centrer horizontalement */
}

.add-buttons::before,
.add-buttons::after {
  content: "";
  flex: 1; /* Occupe 1/3 chacun */
}

.add-buttons button {
  flex: 1; /* Le bouton occupe aussi 1/3 */
  max-width: 250px; /* Pour éviter qu'il devienne trop large sur grands écrans */
  background-color: var(--boad-yellow);
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  color: #333;
  transition: background-color 0.3s ease;
}

    .add-buttons button:hover {
      background-color: var(--boad-yellow-dark);
      color: #111;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 6px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      border: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }
    th {
      background-color: var(--boad-red);
      color: white;
      user-select: none;
    }
    tr.section-title td {
      background-color: #f4f4f4;
      font-weight: 700;
      font-size: 16px;
      color: var(--boad-red-dark);
    }
    tr.subtotal-row td {
      background-color: #fff8dc;
      font-weight: 600;
      font-size: 15px;
      color: var(--boad-red-dark);
    }
    tr.total-row td {
      background-color: var(--boad-red);
      color: var(--white);
      font-weight: bolder;
      font-size: 16px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }
    select:focus, input[type="number"]:focus {
      border-color: var(--boad-red);
      outline: none;
      box-shadow: 0 0 5px var(--boad-red);
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--boad-red);
      font-size: 18px;
      cursor: pointer;
      transition: color 0.3s ease;
    }
    .action-btn:hover { color: var(--boad-red-dark); }

    #enginDescription {
      margin-top: 20px;
      background: #fff3cc;
      padding: 15px;
      border-left: 6px solid var(--boad-yellow);
      border-radius: 4px;
      color: #5c3a00;
      font-style: italic;
      min-height: 50px;
    }

    .fixed-nav-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }
    .fixed-nav-buttons button {
      background-color: var(--boad-yellow);
      color: #333;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      min-width: 160px;
    }
    .fixed-nav-buttons button:hover {
      background-color: var(--boad-yellow-dark);
      color: #111;
    }

    body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('{{ url_for("static", filename="logo-boad.webp") }}');
    background-repeat: repeat;
    background-size: 80px auto;
    opacity: 0.08; /* très léger fond */
    pointer-events: none;
    z-index: -1;
  }


    /* Badges "mode" */
.chip { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; }
.chip-predef { background:#f1f5f9; color:#334155; border:1px solid #e2e8f0; }
.chip-manuel { background:#fff1c2; color:#5c3a00; border:1px solid #ffe08a; }

/* Champs compacts et lisibles */
.input-compact { width:100%; padding:8px 10px; border-radius:6px; border:1px solid #cbd5e1; font-size:14px; }
.input-compact:focus { outline:none; border-color: var(--boad-red); box-shadow: 0 0 0 3px rgb(167 25 48 / 15%); }
.input-readonly { background:#f8fafc; color:#475569; }

/* Aide visuelle pour lignes */
tr td { vertical-align: middle; }

/* Placeholders plus visibles */
::placeholder { color:#94a3b8; }

/* Ajuste les lignes "section" / totaux pour 7 colonnes */
tr.section-title td { font-size: 15px; }

/* Évite que les inputs débordent du tableau */
td input, td select {
  max-width: 100%;
  box-sizing: border-box;
}

/* Colonnes numériques plus étroites (facteur / quantité) */
td:nth-child(4) input,
td:nth-child(5) input {
  text-align: right;
  width: 100px;
}


  </style>
</head>

<body>
  <!-- HEADER horizontal -->
  <header>
    <div class="header-left">
    <img src="{{ url_for('static', filename='BOADCarbone.png') }}" alt="Logo BOAD" />
  </div>
    <div class="header-center">
      <h1>Équipements – Émissions CO₂</h1>
    </div>
    <nav class="header-nav">
      <a href="{{ url_for('index') }}">Accueil</a>
      <a href="{{ url_for('apropos') }}">À propos</a>
      <a href="{{ url_for('contact') }}">Contacts</a>
      <a href="{{ url_for('aide') }}">Aide</a>
    </nav>
  </header>

  <main class="main-content">
    <h2>Équipements</h2>


   <div class="add-buttons">
<div class="add-buttons">
  <button type="button" onclick="addEnginRow('scope_3')">➕ Engins (Agriculture/BTP)</button>
  <button type="button" onclick="addAppareilRow('scope_3')">➕ Appareil (IT/Electricité)</button>
  <button type="button" onclick="addConstructionRow('scope_3')">➕ Construction (Bâtiment/Route)</button>
</div>

</div>


    <table id="equipementTable">
  <thead>
    <tr>
      <th>Type</th>
      <th>Catégorie</th>
      <th>Caractéristiques</th>
      <th>Quantité</th>
      <th>Émissions (kgCO₂e)</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="equipementBody"></tbody>
</table>

    <div id="enginDescription"></div>

    <div class="fixed-nav-buttons">
      <button type="button" onclick="precedent()">← (3/3) Étape précédente</button>
      <button type="button" onclick="suivant()">Compensation carbone →</button>
    </div>
  </main>




<script>
let equipementRows = [];
const enginsData = {{ engins_equipements | tojson }};

// ---------- Helpers ----------
function parseNum(v) {
    if (typeof v === 'number') return v;
    if (!v) return 0;
    const n = parseFloat(String(v).replace(',', '.'));
    return isNaN(n) ? 0 : n;
}

function fmt2(x) {
    return (x || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function afficherDescription(desc) {
    const descEl = document.getElementById('enginDescription');
    if (descEl) descEl.textContent = desc || '';
}

// ---------- Facteurs d’émission ----------
const feMat = {
    gravats: 0.00800,
    amiante: 0.02700,
    asphalte: 0.03920,
    briques: 0.24200,
    beton: 0.11900,
    isolation: 1.86200,
    bois: 0.26900,
    pave: 0.15000
};

// ---------- Densités par défaut ----------
const defaultDensities = {
    beton: 0.0024,
    briques: 0.0019,
    bois: 0.0006,
    isolation: 0.00003,
    gravats: 0.0015,
    asphalte: 0.0023,
    amiante: 0.0026,
    pave: 0.0022
};

// ---------- Compute Emissions ----------
function computeEmissions(row) {
    let total = 0;
    if (row.mode === "engin") {
        const feCarb = { diesel: 2.68, essence: 2.31, elec: 0.075 };
        const cFE = feCarb[row.carburant] || 0;
        const jours = parseNum(row.jours || 1);
        if (row.type_engin === "agricole") {
            const con = row.carburant === 'elec' ? row.puissance * row.duree : row.puissance * 0.24 * row.duree;
            total = con * cFE * (row.surface || 1) * parseNum(row.quantite) * jours;
        } else if (row.type_engin === "btp") {
            total = row.puissance * row.duree * cFE * parseNum(row.quantite) * jours;
        }
    } else if (row.mode === "appareil") {
        total = (parseNum(row.puissance) / 1000) *
                parseNum(row.duree) *
                parseNum(row.jours) *
                0.58 * parseNum(row.quantite);
    } else if (row.mode === "construction") {
        const mat = (row.materiau || "").toLowerCase();
        const FE = feMat[mat] || 0;
        const surface = parseNum(row.longueur) * parseNum(row.largeur);
        const volume = surface * parseNum(row.epaisseur);
        const densite = parseNum(row.densite) || defaultDensities[mat] || 0;
        const masse = volume * densite;
        total = masse * FE * parseNum(row.quantite);
    }
    return total;
}

// ---------- Persistance dans localStorage pour la page résultats ----------
function commitEmissionData() {
    const emissionData = JSON.parse(localStorage.getItem("emissionData")) || {};
    emissionData.equipements = equipementRows.map(row => ({
        ...row,
        emission: computeEmissions(row)
    }));
    const totalGeneral = equipementRows.reduce((acc, r) => acc + computeEmissions(r), 0);
    emissionData.totalEquipements = totalGeneral;
    localStorage.setItem("emissionData", JSON.stringify(emissionData));
}

// ---------- Render Table ----------
function renderTable() {
    const tbody = document.getElementById('equipementBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    const scope = 'scope_3';
    const rowsFiltered = equipementRows.filter(r => r.scope === scope);

    // Section Title
    const trTitle = document.createElement('tr');
    trTitle.className = 'section-title';
    trTitle.innerHTML = `<td colspan="6">SCOPE 3 — ÉQUIPEMENTS</td>`;
    tbody.appendChild(trTitle);

    const categories = ["engin", "appareil", "construction"];

    categories.forEach(cat => {
        const rowsCat = rowsFiltered.filter(r => r.mode === cat);
        rowsCat.forEach((row, rowIndex) => {
            const tr = document.createElement('tr');

            // Type
            const tdMode = document.createElement('td');
            tdMode.textContent = cat === "engin" ? "Engin" : cat === "appareil" ? "Appareil" : "Construction";
            tr.appendChild(tdMode);

            // Catégorie
            const tdCat = document.createElement('td');
            tdCat.textContent = cat === "engin" ? (row.type_engin || '') :
                                cat === "construction" ? (row.type_construction || '') : '-';
            tr.appendChild(tdCat);

            // Caractéristiques
            const tdEngin = document.createElement('td');
            if (cat === "engin") {
                ["type_engin","carburant","puissance","duree","surface","jours"].forEach(field => {
                    const input = (field==="type_engin"||field==="carburant") ? document.createElement('select') : document.createElement('input');
                    input.className = 'input-compact';
                    if (input.tagName==="SELECT") {
                        if(field==="type_engin"){
                            input.innerHTML=`<option value="">Type d'engin</option><option value="agricole">Agricole</option><option value="btp">BTP</option>`;
                        } else {
                            input.innerHTML=`<option value="">Carburant</option><option value="diesel">Diesel</option><option value="essence">Essence</option><option value="elec">Électrique</option>`;
                        }
                        input.value = row[field] || '';
                        input.addEventListener('change', e => { row[field]=e.target.value; updateEmissionRow(rowIndex, cat); saveToStorage(); commitEmissionData(); });
                    } else {
                        input.type="number"; input.step="any"; input.min="0"; input.placeholder = field==="puissance" ? "Puissance CV" :
                                                                                           field==="duree" ? "Durée par jour (h)" :
                                                                                           field==="jours" ? "Nombre de jours" : field;
                        input.value = row[field] || '';
                        input.addEventListener('input', e => { row[field]=parseNum(e.target.value); updateEmissionRow(rowIndex, cat); saveToStorage(); commitEmissionData(); });
                    }
                    tdEngin.appendChild(input);
                });
            } else if (cat === "appareil") {
                ["engin","puissance","duree","jours"].forEach(field => {
                    const input = document.createElement('input');
                    input.className='input-compact';
                    input.type = field==="engin" ? "text" : "number"; input.step="any"; input.min="0";
                    input.placeholder = field==="puissance" ? "Puissance en W" : field==="duree" ? "Durée par jour (h)" : field==="jours" ? "Nombre de jours" : field;
                    input.value = row[field] || '';
                    input.addEventListener('input', e => { row[field] = field==="engin" ? e.target.value : parseNum(e.target.value); updateEmissionRow(rowIndex, cat); saveToStorage(); commitEmissionData(); });
                    tdEngin.appendChild(input);
                });
            } else if (cat === "construction") {
                ["type_construction","materiau","longueur","largeur","epaisseur","densite"].forEach(field => {
                    const input = (field==="type_construction"||field==="materiau") ? document.createElement('select') : document.createElement('input');
                    input.className='input-compact';
                    input.value = row[field] || '';
                    if(input.tagName==="SELECT") {
                        if(field==="type_construction") input.innerHTML=`<option value="">Type</option><option value="route">Route</option><option value="dalle">Dalle</option><option value="mur">Mur</option>`;
                        else input.innerHTML=`<option value="">Matériau</option><option value="beton">Béton</option><option value="asphalte">Asphalte</option><option value="briques">Briques</option><option value="gravats">Gravats</option><option value="isolation">Isolation</option><option value="amiante">Amiante</option><option value="bois">Bois</option><option value="pave">Pavé</option>`;
                        input.addEventListener('change', e => {
                            row[field]=e.target.value;
                           if (defaultDensities[row[field]]) row.densite = defaultDensities[row[field]];
updateEmissionRow(rowIndex, cat);
saveToStorage();
commitEmissionData();

                        });
                    } else {
                        input.type='number'; input.step='any'; input.min='0';
                        input.placeholder = field==="longueur" ? "Longueur (cm)" : field==="largeur" ? "Largeur (cm)" : field==="epaisseur" ? "Épaisseur (cm)" : field==="densite" ? "kg/cm³" : field;
                        input.value = row[field] || (field==="densite" && defaultDensities[row.materiau]) || '';
                        input.addEventListener('input', e=>{ row[field]=parseNum(e.target.value); updateEmissionRow(rowIndex, cat); saveToStorage(); commitEmissionData(); });
                    }
                    tdEngin.appendChild(input);
                });
            }
            tr.appendChild(tdEngin);

            // Quantité
            const tdQ = document.createElement('td');
            const inputQ = document.createElement('input');
            inputQ.type='number'; inputQ.step='any'; inputQ.min='0'; inputQ.className='input-compact'; inputQ.placeholder='Ex.1';
            inputQ.value = row.quantite || '';
            inputQ.addEventListener('input', e => { row.quantite=parseNum(e.target.value); updateEmissionRow(rowIndex, cat); saveToStorage(); commitEmissionData(); });
            tdQ.appendChild(inputQ);
            tr.appendChild(tdQ);

            // Émissions
            const tdE = document.createElement('td');
            tdE.className='emission-cell';
            tdE.textContent = fmt2(computeEmissions(row));
            tdE.dataset.rowIndex = rowIndex;
            tdE.dataset.cat = cat;
            tr.appendChild(tdE);

            // Action
            const tdAct = document.createElement('td');
            const btn = document.createElement('button');
            btn.className='action-btn';
            btn.textContent='🗑️';
            btn.onclick = () => {
                equipementRows.splice(equipementRows.indexOf(row),1);
                afficherDescription('');
                renderTable();
                saveToStorage();
                commitEmissionData();
            };
            tdAct.appendChild(btn);
            tr.appendChild(tdAct);

            tbody.appendChild(tr);
        });
    });

    updateAllSubtotals();
    saveToStorage();
    commitEmissionData();
}

// ---------- Update single row emission ----------
function updateEmissionRow(index, cat) {
    const rowsFiltered = equipementRows.filter(r => r.scope==='scope_3' && r.mode===cat);
    const row = rowsFiltered[index];
    const tdE = document.querySelector(`.emission-cell[data-row-index="${index}"][data-cat="${cat}"]`);
    if(tdE) tdE.textContent = fmt2(computeEmissions(row));
    updateAllSubtotals();
}

// ---------- Update subtotals ----------
function updateAllSubtotals(){
    const tbody = document.getElementById('equipementBody');
    const subtotals = { engin:0, appareil:0, construction:0 };
    equipementRows.forEach(r => subtotals[r.mode] += computeEmissions(r));

    tbody.querySelectorAll('.subtotal-row, .total-row').forEach(tr=>tr.remove());

    ["engin","appareil","construction"].forEach(cat=>{
        const trSub = document.createElement('tr'); trSub.className='subtotal-row';
        trSub.innerHTML = `<td colspan="4"><b>Sous-total ${cat.charAt(0).toUpperCase()+cat.slice(1)}</b></td><td>${fmt2(subtotals[cat])}</td><td></td>`;
        tbody.appendChild(trSub);
    });

    const trTotal = document.createElement('tr'); trTotal.className='total-row';
    const totalGeneral = subtotals.engin + subtotals.appareil + subtotals.construction;
    trTotal.innerHTML = `<td colspan="4"><b>Total Général</b></td><td>${fmt2(totalGeneral)}</td><td></td>`;
    tbody.appendChild(trTotal);
}

// ---------- Save ----------
function saveToStorage(){ sessionStorage.setItem('equipementRows',JSON.stringify(equipementRows)); }

// ---------- Add Rows ----------
function addEnginRow(scope){ equipementRows.push({scope,mode:"engin",quantite:'',carburant:'',type_engin:'',puissance:'',duree:'',jours:'',surface:''}); renderTable(); }
function addAppareilRow(scope){ equipementRows.push({scope,mode:"appareil",engin:'',puissance:'',duree:'',jours:'',quantite:''}); renderTable(); }
function addConstructionRow(scope){ equipementRows.push({scope,mode:"construction",type_construction:'',materiau:'',longueur:'',largeur:'',epaisseur:'',densite:'',quantite:''}); renderTable(); }

// ---------- Navigation ----------
function precedent(){ window.location.href="{{ url_for('energie') }}"; }
function suivant(){ sessionStorage.removeItem('autreRows'); window.location.href="{{ url_for('arbres') }}"; }

// ---------- Init ----------
document.addEventListener('DOMContentLoaded', ()=>{
    const saved = sessionStorage.getItem('equipementRows');
    if(saved) equipementRows = JSON.parse(saved);
    renderTable();
});
</script>
