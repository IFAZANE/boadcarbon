<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interface Équipements - Émissions CO₂</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    :root {
      --boad-red: #a71930;
      --boad-red-dark: #891625;
      --white: #fff;
      --boad-yellow: #FFCC00;
      --boad-yellow-dark: #e6b800;
    }

    body { margin: 0; font-family: Arial, sans-serif; background: #fafafa; }

    /* ==== BARRE DE MENU HORIZONTALE ==== */

  header {
  background-color: #006400; /* Vert foncé */
  height: 80px;
  padding: 0 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  overflow: hidden;
}

    .header-left {
  display: flex;
  align-items: center;
  height: 100%;
}

.header-left img {
  height: 120px;
  width: auto;
  display: block;
  object-fit: contain;
}

    .header-center { flex-grow: 1; min-width: 250px; text-align: center; }
    .header-center h1 {
      margin: 0;
      font-weight: 700;
      font-size: 1.75rem;
      color: #fff;
      user-select: none;
    }
    nav.header-nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    nav.header-nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      transition: background-color 0.3s ease, color 0.3s ease;
      white-space: nowrap;
      font-size: 1rem;
    }
    nav.header-nav a:hover,
    nav.header-nav a:focus {
      background-color: rgba(255, 255, 255, 0.3);
      outline: none;
      color: #ffebc2;
    }
    .quit-btn {
      background-color: var(--boad-red-dark);
      color: white;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .quit-btn:hover { background-color: #70121d; }

    /* ==== CONTENU ==== */
    .main-content {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 20px;
      background: white;
      box-shadow: 0 0 10px rgb(0 0 0 / 0.1);
      border-radius: 8px;
    }

    h2 { color: var(--boad-red); margin-bottom: 20px; }

    .add-buttons {
  margin: 10px 0 20px;
  display: flex;
  justify-content: center; /* Centrer horizontalement */
}

.add-buttons::before,
.add-buttons::after {
  content: "";
  flex: 1; /* Occupe 1/3 chacun */
}

.add-buttons button {
  flex: 1; /* Le bouton occupe aussi 1/3 */
  max-width: 250px; /* Pour éviter qu'il devienne trop large sur grands écrans */
  background-color: var(--boad-yellow);
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  color: #333;
  transition: background-color 0.3s ease;
}

    .add-buttons button:hover {
      background-color: var(--boad-yellow-dark);
      color: #111;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 6px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      border: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }
    th {
      background-color: var(--boad-red);
      color: white;
      user-select: none;
    }
    tr.section-title td {
      background-color: #f4f4f4;
      font-weight: 700;
      font-size: 16px;
      color: var(--boad-red-dark);
    }
    tr.subtotal-row td {
      background-color: #fff8dc;
      font-weight: 600;
      font-size: 15px;
      color: var(--boad-red-dark);
    }
    tr.total-row td {
      background-color: var(--boad-red);
      color: var(--white);
      font-weight: bolder;
      font-size: 16px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }
    select:focus, input[type="number"]:focus {
      border-color: var(--boad-red);
      outline: none;
      box-shadow: 0 0 5px var(--boad-red);
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--boad-red);
      font-size: 18px;
      cursor: pointer;
      transition: color 0.3s ease;
    }
    .action-btn:hover { color: var(--boad-red-dark); }

    #enginDescription {
      margin-top: 20px;
      background: #fff3cc;
      padding: 15px;
      border-left: 6px solid var(--boad-yellow);
      border-radius: 4px;
      color: #5c3a00;
      font-style: italic;
      min-height: 50px;
    }

    .fixed-nav-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }
    .fixed-nav-buttons button {
      background-color: var(--boad-yellow);
      color: #333;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      min-width: 160px;
    }
    .fixed-nav-buttons button:hover {
      background-color: var(--boad-yellow-dark);
      color: #111;
    }

    body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('{{ url_for("static", filename="logo-boad.webp") }}');
    background-repeat: repeat;
    background-size: 80px auto;
    opacity: 0.08; /* très léger fond */
    pointer-events: none;
    z-index: -1;
  }


    /* Badges "mode" */
.chip { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; }
.chip-predef { background:#f1f5f9; color:#334155; border:1px solid #e2e8f0; }
.chip-manuel { background:#fff1c2; color:#5c3a00; border:1px solid #ffe08a; }

/* Champs compacts et lisibles */
.input-compact { width:100%; padding:8px 10px; border-radius:6px; border:1px solid #cbd5e1; font-size:14px; }
.input-compact:focus { outline:none; border-color: var(--boad-red); box-shadow: 0 0 0 3px rgb(167 25 48 / 15%); }
.input-readonly { background:#f8fafc; color:#475569; }

/* Aide visuelle pour lignes */
tr td { vertical-align: middle; }

/* Placeholders plus visibles */
::placeholder { color:#94a3b8; }

/* Ajuste les lignes "section" / totaux pour 7 colonnes */
tr.section-title td { font-size: 15px; }

/* Évite que les inputs débordent du tableau */
td input, td select {
  max-width: 100%;
  box-sizing: border-box;
}

/* Colonnes numériques plus étroites (facteur / quantité) */
td:nth-child(4) input,
td:nth-child(5) input {
  text-align: right;
  width: 100px;
}


  </style>
</head>

<body>
  <!-- HEADER horizontal -->
  <header>
    <div class="header-left">
    <img src="{{ url_for('static', filename='BOADCarbone.png') }}" alt="Logo BOAD" />
  </div>
    <div class="header-center">
      <h1>Équipements – Émissions CO₂</h1>
    </div>
    <nav class="header-nav">
      <a href="{{ url_for('index') }}">Accueil</a>
      <a href="{{ url_for('apropos') }}">À propos</a>
      <a href="{{ url_for('contact') }}">Contacts</a>
      <a href="{{ url_for('aide') }}">Aide</a>
    </nav>
  </header>

  <main class="main-content">
    <h2>Équipements</h2>


   <div class="add-buttons">
<!--  <button type="button" onclick="addEquipementRow('scope_3')">➕ Ajouter équipements</button>-->
      <button type="button" onclick="addEnginRow('scope_3')">➕ Engins (Agriculture/BTP)</button>
 <button type="button" onclick="addAppareilRow('scope_3')">➕ Appareil (IT/Electricité)</button>
</div>


    <table id="equipementTable">
  <thead>
    <tr>
      <th>Type</th>
      <th>Catégorie</th>
      <th>Caractéristiques</th>
      <th>Quantité</th>
      <th>Émissions (kgCO₂e)</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="equipementBody"></tbody>
</table>

    <div id="enginDescription"></div>

    <div class="fixed-nav-buttons">
      <button type="button" onclick="precedent()">← (3/3) Étape précédente</button>
      <button type="button" onclick="suivant()">Compensation carbone →</button>
    </div>
  </main>



<script>
let equipementRows = [];
const enginsData = {{ engins_equipements | tojson }};

// ---------- Helpers ----------
function parseNum(v) {
    if (typeof v === 'number') return v;
    if (!v) return 0;
    const n = parseFloat(String(v).replace(',', '.'));
    return isNaN(n) ? 0 : n;
}

function fmt2(x) {
    return (x || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function afficherDescription(desc) {
    document.getElementById('enginDescription').textContent = desc || '';
}

// ---------- Enable Input Navigation ----------
function enableInputNavigation(input) {
    input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
            e.preventDefault();
            const inputs = Array.from(document.querySelectorAll("input, select"));
            const idx = inputs.indexOf(e.target);
            if (idx !== -1) {
                const next = e.shiftKey ? inputs[idx - 1] : inputs[idx + 1];
                if (next) next.focus();
            }
        }
    });
    return input;
}

// ---------- Compute Emissions ----------
function computeEmissions(row) {
    let total = 0;
    if (row.mode === "engin") {
        const feCarb = { diesel: 2.68, essence: 2.31, elec: 0.075 };
        const cFE = feCarb[row.carburant] || 0;
        if (row.type_engin === "agricole") {
            const con = row.carburant === 'elec' ? row.puissance * row.duree : row.puissance * 0.24 * row.duree;
            total = con * cFE * (row.surface || 1) * parseNum(row.quantite);
        } else if (row.type_engin === "btp") {
            total = row.puissance * row.duree * cFE * parseNum(row.quantite);
        }
    } else if (row.mode === "appareil") {
        total = (parseNum(row.puissance) / 1000) * parseNum(row.duree) * parseNum(row.jours) * 0.58 * parseNum(row.quantite);
    }
    return total;
}

// ---------- Render Table ----------
function renderTable() {
    const tbody = document.getElementById('equipementBody');
    tbody.innerHTML = '';

    const scope = 'scope_3';
    const rowsFiltered = equipementRows.filter(r => r.scope === scope);

    // Section Title
    const trTitle = document.createElement('tr');
    trTitle.className = 'section-title';
    trTitle.innerHTML = `<td colspan="6">SCOPE 3 — ÉQUIPEMENTS</td>`;
    tbody.appendChild(trTitle);

    // Variables pour sous-totaux
    let subtotalEngin = 0;
    let subtotalAppareil = 0;

    rowsFiltered.forEach((row, rowIndex) => {
        const tr = document.createElement('tr');

        // Type (Engin / Appareil)
        const tdMode = document.createElement('td');
        tdMode.textContent = row.mode === "engin" ? "Engin" : "Appareil";
        tr.appendChild(tdMode);

        // Catégorie
        const tdCat = document.createElement('td');
        tdCat.textContent = row.mode === "engin" ? (row.type_engin || '') : '-';
        tr.appendChild(tdCat);

        // Caractéristiques
        const tdEngin = document.createElement('td');

        if (row.mode === "engin") {
            const inputNom = enableInputNavigation(document.createElement('input'));
            inputNom.type = "text"; inputNom.className = "input-compact";
            inputNom.placeholder = "Nom de l'engin"; inputNom.value = row.engin || '';
            inputNom.addEventListener('input', e => { row.engin = e.target.value; updateEmissionCell(rowIndex); });
            tdEngin.appendChild(inputNom);

            const selectType = enableInputNavigation(document.createElement('select'));
            selectType.className = "input-compact";
            selectType.innerHTML = `<option value="">Type d'engin</option>
                                    <option value="agricole">Agricole</option>
                                    <option value="btp">BTP</option>`;
            selectType.value = row.type_engin || '';
            selectType.addEventListener('change', e => { row.type_engin = e.target.value; updateEmissionCell(rowIndex); });
            tdEngin.appendChild(selectType);

            const selectCarb = enableInputNavigation(document.createElement('select'));
            selectCarb.className = 'input-compact';
            selectCarb.innerHTML = `<option value="">Carburant</option>
                                    <option value="diesel">Diesel</option>
                                    <option value="essence">Essence</option>
                                    <option value="elec">Électrique</option>`;
            selectCarb.value = row.carburant || '';
            selectCarb.addEventListener('change', e => { row.carburant = e.target.value; updateEmissionCell(rowIndex); });
            tdEngin.appendChild(selectCarb);

            const inputP = enableInputNavigation(document.createElement('input'));
            inputP.type = "number"; inputP.step="any"; inputP.min="0"; inputP.className = "input-compact"; inputP.placeholder="Puissance (CV ou L/h)";
            inputP.value = row.puissance || '';
            inputP.addEventListener('input', e => { row.puissance = parseNum(e.target.value); updateEmissionCell(rowIndex); });
            tdEngin.appendChild(inputP);

            const inputD = enableInputNavigation(document.createElement('input'));
            inputD.type = "number"; inputD.step="any"; inputD.min="0"; inputD.className = "input-compact"; inputD.placeholder="Durée (h)";
            inputD.value = row.duree || '';
            inputD.addEventListener('input', e => { row.duree = parseNum(e.target.value); updateEmissionCell(rowIndex); });
            tdEngin.appendChild(inputD);

            const inputS = enableInputNavigation(document.createElement('input'));
            inputS.type = "number"; inputS.step="any"; inputS.min="0"; inputS.className = "input-compact"; inputS.placeholder="Surface (ha)";
            inputS.value = row.surface || '';
            inputS.addEventListener('input', e => { row.surface = parseNum(e.target.value); updateEmissionCell(rowIndex); });
            tdEngin.appendChild(inputS);
        }

        if (row.mode === "appareil") {
            ["engin","puissance","duree","jours"].forEach(field => {
                const input = enableInputNavigation(document.createElement('input'));
                input.type = field==="engin" ? "text" : "number";
                input.step="any"; input.min="0"; input.className = "input-compact";
                input.placeholder = field==="engin" ? "Nom de l'appareil" : field==="puissance" ? "Puissance (W)" : field==="duree" ? "Durée (h/jour)" : "Nb de jours";
                input.value = row[field] || '';
                input.addEventListener('input', e => { row[field] = field==="engin"?e.target.value:parseNum(e.target.value); updateEmissionCell(rowIndex); });
                tdEngin.appendChild(input);
            });
        }

        tr.appendChild(tdEngin);

        // Quantité
        const tdQ = document.createElement('td');
        const inputQ = enableInputNavigation(document.createElement('input'));
        inputQ.type='number'; inputQ.step='any'; inputQ.min='0'; inputQ.className='input-compact'; inputQ.placeholder='Ex.1';
        inputQ.value = row.quantite || '';
        inputQ.addEventListener('input', e => { row.quantite = parseNum(e.target.value); updateEmissionCell(rowIndex); });
        tdQ.appendChild(inputQ); tr.appendChild(tdQ);

        // Émissions
        const tdE = document.createElement('td');
        tdE.className = 'emission-cell';
        const emission = computeEmissions(row);
        tdE.textContent = fmt2(emission);
        tr.appendChild(tdE);

        // Mise à jour des sous-totaux
        if(row.mode==="engin") subtotalEngin += emission;
        if(row.mode==="appareil") subtotalAppareil += emission;

        // Action
        const tdAct = document.createElement('td');
        const btn = document.createElement('button'); btn.className='action-btn'; btn.textContent='🗑️';
        btn.onclick = () => { equipementRows.splice(equipementRows.indexOf(row),1); afficherDescription(''); renderTable(); };
        tdAct.appendChild(btn); tr.appendChild(tdAct);

        tbody.appendChild(tr);
    });

    // Ligne sous-totaux
    const trSubEngin = document.createElement('tr');
    trSubEngin.className='subtotal-row';
    trSubEngin.innerHTML = `<td colspan="4"><b>Sous-total Engins</b></td><td>${fmt2(subtotalEngin)}</td><td></td>`;
    tbody.appendChild(trSubEngin);

    const trSubApp = document.createElement('tr');
    trSubApp.className='subtotal-row';
    trSubApp.innerHTML = `<td colspan="4"><b>Sous-total Appareils</b></td><td>${fmt2(subtotalAppareil)}</td><td></td>`;
    tbody.appendChild(trSubApp);

    // Ligne total général
    const trTotal = document.createElement('tr');
    trTotal.className='total-row';
    trTotal.innerHTML = `<td colspan="4"><b>Total Général</b></td><td>${fmt2(subtotalEngin + subtotalAppareil)}</td><td></td>`;
    tbody.appendChild(trTotal);

    // Sauvegarde dans sessionStorage pour page résultat
    const totals = { subtotalEngin, subtotalAppareil, totalGeneral: subtotalEngin + subtotalAppareil };
    sessionStorage.setItem('equipementTotals', JSON.stringify(totals));
    saveToStorage();
}

// ---------- Update only emission cell ----------
function updateEmissionCell(index) {
    const tbody = document.getElementById('equipementBody');
    const row = equipementRows.filter(r => r.scope === 'scope_3')[index];
    const tr = tbody.children[index + 1]; // +1 car 1ère ligne = titre
    const tdE = tr.querySelector('.emission-cell');
    const emission = computeEmissions(row);
    tdE.textContent = fmt2(emission);
    renderTable(); // Recalculer sous-totaux et total général
}

// ---------- Save ----------
function saveToStorage() {
    sessionStorage.setItem('equipementRows', JSON.stringify(equipementRows));
}

// ---------- Add Rows ----------
function addEnginRow(scope){equipementRows.push({scope,mode:"engin",categorie:'',engin:'',quantite:'',carburant:'',type_engin:'',puissance:'',duree:'',surface:'',_autofocus:true}); renderTable();}
function addAppareilRow(scope){equipementRows.push({scope,mode:"appareil",engin:'',puissance:'',duree:'',jours:'',quantite:'',unite:'kWh',_autofocus:true}); renderTable();}

// ---------- Navigation ----------
function precedent(){window.location.href="{{ url_for('energie') }}";}
function suivant(){sessionStorage.removeItem('autreRows');window.location.href="{{ url_for('arbres') }}";}

document.addEventListener('DOMContentLoaded',()=>{
    const saved=sessionStorage.getItem('equipementRows');
    if(saved) equipementRows=JSON.parse(saved);
    renderTable();
});
</script>
